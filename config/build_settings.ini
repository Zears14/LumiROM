[build]
version = 8.6.1
build_status = UNOFFICIAL
rom_tag = 🛠️ LumiROM Local Build
output_filesystem = erofs

[paths]
devtools_dir = bin/erofs-utils
apktool = bin/apktool/apktool.jar
vndks_collection = LumiROM/vndks

[partitions]
build_partitions = product,vendor,odm,system_ext,system

[dependencies]
required_bins = 7z,java,python3,simg2img,aria2c,brotli,debugfs,tar,file,unzip,xxd,zstd,xxhsum

[sandbox]
enabled = true
provider = podman
base_image = docker.io/library/alpine:3.20
image_name = lumirom-build-sandbox
containerfile = containers/podman/Containerfile
workspace_mount = /workspace
packages = aria2,brotli,ca-certificates,openjdk11-jre-headless,e2fsprogs-extra,file,7zip,python3,tar,unzip,xxd,zstd,android-tools,xxhash,secilc
privileged = false
shm_size = 8g

[workspace]
transient_dirs = FIRMWARE,WORK,OUT,TMP,/dev/shm/WORK
tmpfs_work = /dev/shm/WORK

[preflight]
min_cpu_count = 2
min_memory_gb = 8
min_workspace_free_gb = 16
min_cache_free_gb = 4
min_tmpfs_free_gb = 4

[performance]
extract_erofs_jobs = auto
extract_erofs_threads = auto
extract_ext4_jobs = auto
package_jobs = auto
mkfs_workers = auto
fast_img2sdat = true
erofs_compressor = lz4hc
brotli_quality = 1
zip_metadata_level = 1

